<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1113">
  <title>Warfighter Fate Deck</title>

  <style>
    :root {
      --bg: #0f1113;
      --panel: #191c20;
      --panel2: #22262b;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #343941;
      --accent: #d7d2b2;
      --accentText: #111318;
      --danger: #ef8b8b;
      --good: #4caf7d;
      --scout: #c8a84b;
      --safeBottom: env(safe-area-inset-bottom, 0px);
      --safeTop: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      padding-top: var(--safeTop);
      padding-bottom: calc(96px + var(--safeBottom));
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .title-wrap {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(1rem, 4vw, 1.35rem);
      line-height: 1.1;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .small-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    #scoutBtn {
      border-color: var(--scout);
      color: var(--scout);
    }

    #scoutBtn.used {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: var(--border);
      color: var(--muted);
    }

    .peek-panel {
      display: none;
      border: 1px solid var(--scout);
      background: color-mix(in srgb, var(--scout) 8%, var(--panel));
      border-radius: 12px;
      padding: 10px 40px 10px 12px;
      margin-bottom: 10px;
      position: relative;
    }

    .peek-title {
      display: block;
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--scout);
      margin-bottom: 8px;
    }

    .peek-values {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      text-align: center;
    }

    .peek-slot {
      display: block;
      font-size: 0.58rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1px;
    }

    .peek-num {
      display: block;
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--scout);
      line-height: 1;
    }

    .peek-num.cover-num {
      color: #b9d7e8;
    }

    .peek-dismiss {
      position: absolute;
      top: 8px;
      right: 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      line-height: 1;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .status-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }

    .status-value {
      display: block;
      font-weight: 800;
      font-size: 1.15rem;
    }

    .status-label {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.67rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .event {
      display: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 8%, transparent);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .random-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .random-box {
      position: relative;
      min-height: clamp(150px, 28vh, 250px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .random-box.primary-c {
      background: #24313a;
      border-color: #526b7a;
    }

    .random-box.primary-c .random-label {
      color: #b9d7e8;
    }

    .random-box.primary-c .random-value {
      color: #dff3ff;
    }

    .random-label {
      position: absolute;
      top: 12px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      font-size: clamp(0.72rem, 2.7vw, 0.9rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .random-value {
      font-size: clamp(4rem, 20vw, 8.5rem);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.05em;
    }

    .placeholder {
      color: #545a63;
    }

    .use-hint {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.35;
    }

    .history-panel {
      margin-top: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
      overflow: hidden;
    }

    .history-toggle {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 13px 14px;
      text-align: left;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-content {
      display: none;
      border-top: 1px solid var(--border);
      padding: 10px 12px 12px;
    }

    .history-content.open {
      display: block;
    }

    .history {
      margin: 0;
      padding-left: 24px;
      max-height: 240px;
      overflow: auto;
      color: #d6d9dd;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
    }

    .history li {
      padding: 3px 0;
    }

    .draw-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      padding: 10px 12px calc(10px + var(--safeBottom));
      background: linear-gradient(to top, var(--bg) 75%, transparent);
    }

    .draw-inner {
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    #drawBtn {
      width: 100%;
      min-height: 72px;
      border: 0;
      border-radius: 18px;
      background: var(--accent);
      color: var(--accentText);
      font-weight: 950;
      font-size: clamp(1.25rem, 5vw, 1.8rem);
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
      touch-action: manipulation;
    }

    #drawBtn:active,
    .icon-btn:active {
      transform: scale(.985);
    }

    @media (orientation: landscape) and (min-width: 700px) {
      body {
        padding-bottom: calc(86px + var(--safeBottom));
      }

      .random-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .random-box {
        min-height: min(52vh, 360px);
      }

      .random-value {
        font-size: clamp(4.5rem, 11vw, 8rem);
      }

      .app {
        padding: 10px 16px;
      }

      #drawBtn {
        min-height: 62px;
      }
    }

    @media (min-width: 900px) and (orientation: portrait) {
      .random-grid {
        gap: 14px;
      }

      .random-box {
        min-height: 300px;
      }
    }

    /* ── Deck Quality Indicator ── */

    .quality-panel {
      margin-top: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px 12px;
    }

    .quality-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .quality-title {
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .deck-temp {
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 9px;
      border-radius: 6px;
    }

    .deck-temp.hot     { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
    .deck-temp.cold    { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
    .deck-temp.neutral { background: var(--panel2); color: var(--muted); }

    .quality-rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .quality-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .q-label {
      font-size: 0.63rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      width: 48px;
      flex-shrink: 0;
    }

    .q-bar {
      position: relative;
      flex: 1;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      background: var(--panel2);
    }

    .q-seg {
      height: 100%;
      transition: flex 0.25s ease;
    }

    /* Fixed reference ticks at original Low/Mid/High boundaries */
    .q-ref {
      position: absolute;
      top: 0;
      height: 100%;
      width: 2px;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2;
      pointer-events: none;
    }

    .q-low  { background: var(--danger); }
    .q-mid  { background: var(--scout); }
    .q-high { background: var(--good); }

    .q-count {
      font-size: 0.6rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
      white-space: nowrap;
      width: 80px;
      flex-shrink: 0;
      text-align: right;
    }

    .quality-legend {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      justify-content: center;
    }

    .q-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.6rem;
      color: var(--muted);
    }

    .q-legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="topbar">
      <div class="title-wrap">
        <h1>Fate Deck</h1>
        <div class="subtitle">Warfighter WWII · 30 cards</div>
      </div>

      <div class="small-actions">
        <button id="historyBtn" class="icon-btn" type="button" aria-label="Show history">HIST</button>
        <button id="scoutBtn" class="icon-btn" type="button" aria-label="Scout — peek top card">SCOUT</button>
        <button id="resetBtn" class="icon-btn" type="button" aria-label="Reset deck">RESET</button>
      </div>
    </div>

    <section class="status" aria-label="Estado del mazo">
      <div class="status-box">
        <span id="remaining" class="status-value">—</span>
        <span class="status-label">Left</span>
      </div>
      <div class="status-box">
        <span id="drawCount" class="status-value">0</span>
        <span class="status-label">Draws</span>
      </div>
      <div class="status-box">
        <span id="reshuffleCount" class="status-value">0</span>
        <span class="status-label">Reshuffles</span>
      </div>
    </section>

    <div id="event" class="event" role="status" aria-live="polite"></div>

    <div id="peekPanel" class="peek-panel" role="status" aria-live="polite">
      <span class="peek-title">SCOUT — NEXT CARD</span>
      <div class="peek-values">
        <div>
          <span class="peek-slot">COVER</span>
          <span id="peekQ" class="peek-num cover-num">—</span>
        </div>
        <div>
          <span class="peek-slot">ATTK 1</span>
          <span id="peekA" class="peek-num">—</span>
        </div>
        <div>
          <span class="peek-slot">ATTK 2</span>
          <span id="peekB" class="peek-num">—</span>
        </div>
        <div>
          <span class="peek-slot">ATTK 3</span>
          <span id="peekC" class="peek-num">—</span>
        </div>
      </div>
      <button id="peekDismiss" class="peek-dismiss" type="button" aria-label="Dismiss scout">×</button>
    </div>

    <section class="random-grid" aria-live="polite">
      <div class="random-box primary-c">
        <div class="random-label">COVER</div>
        <div id="q" class="random-value placeholder">—</div>
      </div>

      <div class="random-box">
        <div class="random-label">ATTK 1</div>
        <div id="a" class="random-value placeholder">—</div>
      </div>

      <div class="random-box">
        <div class="random-label">ATTK 2</div>
        <div id="b" class="random-value placeholder">—</div>
      </div>

      <div class="random-box">
        <div class="random-label">ATTK 3</div>
        <div id="c" class="random-value placeholder">—</div>
      </div>
    </section>

    <div id="qualityPanel" class="quality-panel">
      <div class="quality-header">
        <span class="quality-title">Deck Quality</span>
        <span id="deckTemp" class="deck-temp neutral">—</span>
      </div>
      <div class="quality-rows">
        <div class="quality-row">
          <span class="q-label">Cover</span>
          <div class="q-bar">
            <div id="qcv-low"  class="q-seg q-low"></div>
            <div id="qcv-mid"  class="q-seg q-mid"></div>
            <div id="qcv-high" class="q-seg q-high"></div>
            <div class="q-ref" style="left:33.33%"></div>
            <div class="q-ref" style="left:66.67%"></div>
          </div>
          <span id="qcv-count" class="q-count"></span>
        </div>

        <div class="quality-row">
          <span class="q-label">Attk1</span>
          <div class="q-bar">
            <div id="qa1-low"  class="q-seg q-low"></div>
            <div id="qa1-mid"  class="q-seg q-mid"></div>
            <div id="qa1-high" class="q-seg q-high"></div>
            <div class="q-ref" style="left:30%"></div>
            <div class="q-ref" style="left:60%"></div>
          </div>
          <span id="qa1-count" class="q-count"></span>
        </div>
        <div class="quality-row">
          <span class="q-label">Attk2</span>
          <div class="q-bar">
            <div id="qa2-low"  class="q-seg q-low"></div>
            <div id="qa2-mid"  class="q-seg q-mid"></div>
            <div id="qa2-high" class="q-seg q-high"></div>
            <div class="q-ref" style="left:30%"></div>
            <div class="q-ref" style="left:60%"></div>
          </div>
          <span id="qa2-count" class="q-count"></span>
        </div>
        <div class="quality-row">
          <span class="q-label">Attk3</span>
          <div class="q-bar">
            <div id="qa3-low"  class="q-seg q-low"></div>
            <div id="qa3-mid"  class="q-seg q-mid"></div>
            <div id="qa3-high" class="q-seg q-high"></div>
            <div class="q-ref" style="left:30%"></div>
            <div class="q-ref" style="left:60%"></div>
          </div>
          <span id="qa3-count" class="q-count"></span>
        </div>
              </div>
      <div class="quality-legend">
        <span class="q-legend-item"><span class="q-legend-dot" style="background:var(--danger)"></span>Low values</span>
        <span class="q-legend-item"><span class="q-legend-dot" style="background:var(--scout)"></span>Mid values</span>
        <span class="q-legend-item"><span class="q-legend-dot" style="background:var(--good)"></span>High values</span>
      </div>
    </div>

    <section id="historyPanel" class="history-panel">
      <button id="historyToggle" class="history-toggle" type="button">
        <span>History</span>
        <span id="historyChevron">▼</span>
      </button>
      <div id="historyContent" class="history-content">
        <ol id="history" class="history"></ol>
      </div>
    </section>
  </main>

  <div class="draw-bar">
    <div class="draw-inner">
      <button id="drawBtn" type="button">DRAW</button>
    </div>
  </div>

  <script>
    "use strict";

    const RANDOM_CARDS = [
      {a:1,  b:6,  c:6,  q:2},
      {a:2,  b:2,  c:8,  q:2},
      {a:3,  b:10, c:5,  q:5},
      {a:4,  b:10, c:10, q:2},
      {a:5,  b:2,  c:7,  q:4},
      {a:6,  b:9,  c:3,  q:1},
      {a:7,  b:5,  c:3,  q:1},
      {a:8,  b:8,  c:10, q:1},
      {a:9,  b:3,  c:4,  q:6},
      {a:10, b:3,  c:6,  q:3},

      {a:1,  b:7,  c:1,  q:3},
      {a:2,  b:4,  c:5,  q:3},
      {a:3,  b:6,  c:7,  q:6},
      {a:4,  b:4,  c:2,  q:2},
      {a:5,  b:7,  c:10, q:6},
      {a:6,  b:6,  c:1,  q:5},
      {a:7,  b:8,  c:2,  q:5},
      {a:8,  b:7,  c:9,  q:6},
      {a:9,  b:8,  c:9,  q:4},
      {a:10, b:2,  c:2,  q:5},

      {a:1,  b:5,  c:8,  q:1},
      {a:2,  b:1,  c:4,  q:4},
      {a:3,  b:1,  c:8,  q:5},
      {a:4,  b:9,  c:3,  q:3},
      {a:5,  b:3,  c:4,  q:6},
      {a:6,  b:10, c:6,  q:4},
      {a:7,  b:4,  c:9,  q:3},
      {a:8,  b:5,  c:7,  q:4},
      {a:9,  b:1,  c:5,  q:2},
      {a:10, b:9,  c:1,  q:1}
    ];

    const RESHUFFLE_CARD = { reshuffle: true };

    let deck = [];
    let drawCount = 0;
    let reshuffleCount = 0;
    let peeksUsed = 0;
    const MAX_PEEKS = 1;
    let eventTimer = null;

    const $ = id => document.getElementById(id);

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function buildDeck() {
      const cards = RANDOM_CARDS.map(card => ({...card}));
      shuffle(cards);

      // Insert reshuffle card near the middle: positions 14-18 in a 31-card deck.
      const insertIndex = 13 + Math.floor(Math.random() * 5);
      cards.splice(insertIndex, 0, {...RESHUFFLE_CARD});

      deck = cards;
      peeksUsed = 0;
      hidePeek();
      updateScoutBtn();
      updateStatus();
      updateQuality();
    }

    function resetGame() {
      drawCount = 0;
      reshuffleCount = 0;
      peeksUsed = 0;

      ["a", "b", "c", "q"].forEach(id => {
        $(id).textContent = "—";
        $(id).classList.add("placeholder");
      });

      $("history").innerHTML = "";
      hideEvent();
      hidePeek();
      buildDeck();
      updateStatus();
    }

    function drawCard() {
      hideEvent();
      hidePeek();

      if (!deck.length) {
        buildDeck();
      }

      const card = deck.shift();

      if (card.reshuffle) {
        reshuffleCount++;
        addHistory("── RESHUFFLE ──");
        showEvent("RESHUFFLE — deck reset");

        buildDeck();
        updateStatus();

        return drawCard();
      }

      drawCount++;

      $("a").textContent = card.a;
      $("b").textContent = card.b;
      $("c").textContent = card.c;
      $("q").textContent = card.q;

      ["a", "b", "c", "q"].forEach(id => {
        $(id).classList.remove("placeholder");
      });

      addHistory(`Attk1:${card.a}  Attk2:${card.b}  Attk3:${card.c}  Cover:${card.q}`);
      updateStatus();
      updateQuality();

      if (navigator.vibrate) {
        navigator.vibrate(15);
      }
    }

    function scout() {
      if (peeksUsed >= MAX_PEEKS || !deck.length) return;

      const card = deck[0];
      peeksUsed++;
      updateScoutBtn();

      if (card.reshuffle) {
        $("peekA").textContent = "—";
        $("peekB").textContent = "—";
        $("peekC").textContent = "—";
        $("peekQ").textContent = "—";
        $("peekPanel").querySelector(".peek-title").textContent = "SCOUT — RESHUFFLE NEXT";
        addHistory("SCOUT: RESHUFFLE NEXT");
      } else {
        $("peekA").textContent = card.a;
        $("peekB").textContent = card.b;
        $("peekC").textContent = card.c;
        $("peekQ").textContent = card.q;
        $("peekPanel").querySelector(".peek-title").textContent = "SCOUT — NEXT CARD";
        addHistory(`SCOUT: Attk1:${card.a}  Attk2:${card.b}  Attk3:${card.c}  Cover:${card.q}`);
      }

      $("peekPanel").style.display = "block";

      if (navigator.vibrate) {
        navigator.vibrate([10, 30, 10]);
      }
    }

    function hidePeek() {
      $("peekPanel").style.display = "none";
    }

    function updateScoutBtn() {
      const btn = $("scoutBtn");
      const exhausted = peeksUsed >= MAX_PEEKS;
      btn.classList.toggle("used", exhausted);
      btn.disabled = exhausted;
    }

    function addHistory(text) {
      const li = document.createElement("li");
      li.textContent = text;
      $("history").insertBefore(li, $("history").firstChild);
    }

    function showEvent(text) {
      clearTimeout(eventTimer);
      $("event").textContent = text;
      $("event").style.display = "block";

      eventTimer = setTimeout(() => {
        hideEvent();
      }, 2200);
    }

    function hideEvent() {
      clearTimeout(eventTimer);
      $("event").style.display = "none";
      $("event").textContent = "";
    }

    function updateStatus() {
      $("remaining").textContent = deck.length;
      $("drawCount").textContent = drawCount;
      $("reshuffleCount").textContent = reshuffleCount;
    }

    function computeQuality() {
      const cards = deck.filter(c => !c.reshuffle);
      const total = cards.length;
      const slots = {
        a1: {low: 0, mid: 0, high: 0},
        a2: {low: 0, mid: 0, high: 0},
        a3: {low: 0, mid: 0, high: 0},
        cv: {low: 0, mid: 0, high: 0}
      };

      const band10 = v => v <= 3 ? 'low' : v <= 6 ? 'mid' : 'high';
      const band6  = v => v <= 2 ? 'low' : v <= 4 ? 'mid' : 'high';

      cards.forEach(c => {
        slots.a1[band10(c.a)]++;
        slots.a2[band10(c.b)]++;
        slots.a3[band10(c.c)]++;
        slots.cv[band6(c.q)]++;
      });

      return {slots, total};
    }

    function updateQuality() {
      const {slots, total} = computeQuality();

      const pairs = [
        ['a1', 'qa1'],
        ['a2', 'qa2'],
        ['a3', 'qa3'],
        ['cv', 'qcv']
      ];

      pairs.forEach(([slot, id]) => {
        const {low, mid, high} = slots[slot];
        $(id + '-low').style.flex  = low;
        $(id + '-mid').style.flex  = mid;
        $(id + '-high').style.flex = high;
        $(id + '-count').textContent = total > 0
          ? `L:${low} M:${mid} H:${high}`
          : '—';
      });

      // Deck temperature badge — based on ATTK 1 high/low proportions
      const tempEl = $('deckTemp');
      if (total === 0) {
        tempEl.textContent = '—';
        tempEl.className = 'deck-temp neutral';
        return;
      }
      const highPct = slots.a1.high / total;
      const lowPct  = slots.a1.low  / total;
      if (highPct > 0.45) {
        tempEl.textContent = 'HOT';
        tempEl.className = 'deck-temp hot';
      } else if (lowPct > 0.35) {
        tempEl.textContent = 'COLD';
        tempEl.className = 'deck-temp cold';
      } else {
        tempEl.textContent = 'NEUTRAL';
        tempEl.className = 'deck-temp neutral';
      }
    }

    function toggleHistory(forceOpen = null) {
      const content = $("historyContent");
      const isOpen = content.classList.contains("open");
      const shouldOpen = forceOpen === null ? !isOpen : forceOpen;

      content.classList.toggle("open", shouldOpen);
      $("historyChevron").textContent = shouldOpen ? "▲" : "▼";

      if (shouldOpen) {
        $("historyPanel").scrollIntoView({behavior: "smooth", block: "nearest"});
      }
    }

    $("drawBtn").addEventListener("click", drawCard);
    $("resetBtn").addEventListener("click", resetGame);
    $("scoutBtn").addEventListener("click", scout);
    $("peekDismiss").addEventListener("click", hidePeek);
    $("historyBtn").addEventListener("click", () => toggleHistory());
    $("historyToggle").addEventListener("click", () => toggleHistory());

    document.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();
        drawCard();
      }
    });

    resetGame();
  </script>
</body>
</html>
